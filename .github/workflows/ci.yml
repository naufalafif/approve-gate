name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build approve
        run: |
          swiftc -O mac/*.swift -o mac/approve
          codesign --force --sign - --options runtime mac/approve
      - name: Build test phone
        run: swiftc -O tools/fakephone.swift -o tools/fakephone
      - name: Smoke test
        run: |
          out="$(./mac/approve 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "usage: approve"
      - name: Gate rules and hook decisions
        run: tests/run.sh
      - name: End to end with the fake phone over ntfy.sh
        run: |
          swiftc -O -D APPROVE_TEST mac/*.swift -o mac/approve-test
          codesign --force --sign - --options runtime mac/approve-test
          tests/e2e.sh

  android:
    name: Android lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug APK
        # Release builds need the signing key, which never leaves the Mac.
        run: ./gradlew --no-daemon :app:assembleDebug
