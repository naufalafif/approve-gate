name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1" # Mondays 08:00 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The binary, not gitleaks-action: on a push the action only scans the pushed range.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan every commit
        run: '"$(go env GOPATH)/bin/gitleaks" git . --redact --no-banner --exit-code 1'

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: >-
          semgrep scan --metrics=off --error
          --config p/kotlin --config p/java --config p/swift
          --config p/secrets --config p/github-actions

  dependencies:
    name: Dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Libraries that ship in the APK (blocking)
        run: |
          mkdir -p "$RUNNER_TEMP/shipped"
          grep -E '^#|releaseRuntimeClasspath' android/app/gradle.lockfile > "$RUNNER_TEMP/shipped/gradle.lockfile"
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile "$RUNNER_TEMP/shipped/gradle.lockfile"
      - name: Build tooling, not shipped (report only)
        continue-on-error: true
        run: '"$(go env GOPATH)/bin/osv-scanner" scan source --lockfile android/app/gradle.lockfile'

  workflows:
    name: Workflow security (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: zizmor
        run: pipx run zizmor==1.31.1 --persona regular .github/workflows

  gradle-wrapper:
    name: Gradle wrapper checksum
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
